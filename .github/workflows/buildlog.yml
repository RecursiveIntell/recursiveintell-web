name: Buildlog

on:
  release:
    types: [published]
  schedule:
    - cron: "18 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-buildlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm buildlog:update
      - name: Commit buildlog
        run: |
          if git diff --quiet -- public/data/buildlog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/buildlog.json
          git commit -m "chore: update buildlog"
          git push
